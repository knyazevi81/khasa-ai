upstream khasa_backend {
    server backend:8000;
}

upstream khasa_frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 25M;

    # ── API ───────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://khasa_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;

        # WebSocket support (для будущего стриминга агентного режима)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── OpenAPI / Swagger ────────────────────────────────────────────────────
    location ~ ^/(docs|openapi\.json|redoc) {
        proxy_pass http://khasa_backend;
        proxy_set_header Host $host;
    }

    # ── Next.js (всё остальное) ──────────────────────────────────────────────
    location / {
        proxy_pass http://khasa_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js HMR / WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
