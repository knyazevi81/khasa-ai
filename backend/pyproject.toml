[project]
name = "khasa-backend"
version = "0.1.0"
description = "khasa — умный ассистент с графом диалога"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosmtplib>=5.1.0",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.10",
    "fastapi>=0.135.3",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "pwdlib[bcrypt]>=0.3.0",
    "pydantic-settings>=2.13.1",
    "pydantic[email]>=2.12.5",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy>=2.0.49",
    "uvicorn[standard]>=0.35.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.12",
    "websockets>=16.0",
    "cryptography>=44.0.0",
    "pypdf>=5.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]
